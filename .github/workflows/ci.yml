name: checks
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check app-core.js
      - name: No em or en dashes in user-facing copy
        run: |
          if grep -rnP '[\x{2014}\x{2013}]' --include='*.html' --include='*.md' --include='*.js' . --exclude-dir=.git --exclude-dir=assets; then
            echo 'Em or en dash found. Rewrite with commas, colons, or parentheses.'
            exit 1
          fi
          echo 'clean'
